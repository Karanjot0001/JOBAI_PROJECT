<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JobAI — Create Account</title>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">


    <!-- ================= AUTH CONTAINER ================= -->

    <div class="auth-wrap">


        <!-- ================= BRAND ================= -->

        <div class="auth-brand">

            <div class="brand-icon">
                ✣
            </div>

            <div class="brand-text">

                <b>JobAI</b>

                <small>
                    AI Resume Analyzer & Job Matcher
                </small>

            </div>

        </div>


        <!-- ================= SIGNUP CARD ================= -->

        <div class="auth-card">


            <!-- Intro -->

            <div class="auth-copy">

                <span class="eyebrow">
                    GET STARTED
                </span>

                <h1>
                    Create your JobAI account
                </h1>

                <p>
                    Set up your profile once. Your dashboard will be
                    personalized with your name and resume results.
                </p>

            </div>


            <!-- ================= SIGNUP FORM ================= -->

            <form
                id="signupForm"
                class="form"
            >


                <!-- Full Name -->

                <label for="name">

                    Full Name

                    <input
                        id="name"
                        type="text"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </label>


                <!-- Email -->

                <label for="email">

                    Email

                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </label>


                <!-- Password -->

                <label for="password">

                    Password

                    <input
                        id="password"
                        type="password"
                        minlength="6"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        required
                    >

                </label>


                <!-- Career Goal -->

                <label for="goal">

                    Career Goal

                    <select id="goal">

                        <option>
                            Full Stack Developer
                        </option>

                        <option>
                            AI/ML Engineer
                        </option>

                        <option>
                            Frontend Developer
                        </option>

                        <option>
                            Backend Developer
                        </option>

                        <option>
                            Data Analyst
                        </option>

                    </select>

                </label>


                <!-- Terms -->

                <label class="remember">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the project terms
                    </span>

                </label>


                <!-- Create Account -->

                <button
                    type="submit"
                    class="btn primary auth-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- ================= LOGIN LINK ================= -->

            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <!-- ================= TOAST ================= -->

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================= TOAST ================= */

        function toast(message) {

            const toastElement =
                document.getElementById("toast");


            toastElement.textContent =
                message;


            toastElement.classList.add("show");


            setTimeout(() => {

                toastElement.classList.remove("show");

            }, 2200);

        }


        /* ================= SIGNUP ================= */

        document.getElementById("signupForm").onsubmit =
            event => {

                event.preventDefault();


                /* Get form values */

                const account = {

                    name:
                        document
                            .getElementById("name")
                            .value
                            .trim(),

                    email:
                        document
                            .getElementById("email")
                            .value
                            .trim(),

                    password:
                        document
                            .getElementById("password")
                            .value,

                    goal:
                        document
                            .getElementById("goal")
                            .value

                };


                /* Save account */

                localStorage.setItem(
                    "jobai-account",
                    JSON.stringify(account)
                );


                /* Save logged-in user */

                localStorage.setItem(
                    "jobai-user",
                    JSON.stringify({

                        name:
                            account.name,

                        email:
                            account.email

                    })
                );


                /* Save career goal */

                localStorage.setItem(
                    "jobai-goal",
                    account.goal
                );


                /* Success message */

                toast(
                    "Account created successfully"
                );


                /* Go to dashboard */

                setTimeout(() => {

                    location.href =
                        "index.html";

                }, 500);

            };

    </script>


</body>

</html>
