<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loading | JobAI</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================================
           LOADING PAGE
        ===================================================== */

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(79, 70, 229, 0.18),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #070b18,
                    #10162b,
                    #080c19
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 20px;

        }


        /* =====================================================
           BACKGROUND PARTICLES
        ===================================================== */

        .background {

            position: absolute;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

        }


        .particle {

            position: absolute;

            width: 5px;
            height: 5px;

            background: rgba(
                255,
                255,
                255,
                0.35
            );

            border-radius: 50%;

            animation:
                float 6s infinite ease-in-out;

        }


        .particle:nth-child(1) {
            top: 15%;
            left: 15%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            top: 30%;
            left: 80%;
            animation-delay: 1s;
        }

        .particle:nth-child(3) {
            top: 70%;
            left: 20%;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            top: 80%;
            left: 75%;
            animation-delay: 3s;
        }

        .particle:nth-child(5) {
            top: 45%;
            left: 90%;
            animation-delay: 1.5s;
        }

        .particle:nth-child(6) {
            top: 65%;
            left: 50%;
            animation-delay: 2.5s;
        }

        .particle:nth-child(7) {
            top: 20%;
            left: 55%;
            animation-delay: 4s;
        }

        .particle:nth-child(8) {
            top: 85%;
            left: 40%;
            animation-delay: 3.5s;
        }


        @keyframes float {

            0%,
            100% {

                transform:
                    translateY(0)
                    scale(1);

                opacity: 0.3;

            }

            50% {

                transform:
                    translateY(-35px)
                    scale(1.5);

                opacity: 1;

            }

        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .loader-container {

            position: relative;

            z-index: 5;

            width: min(
                100%,
                500px
            );

            text-align: center;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-wrapper {

            position: relative;

            width: clamp(
                80px,
                18vw,
                100px
            );

            height: clamp(
                80px,
                18vw,
                100px
            );

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: clamp(
                20px,
                5vw,
                30px
            );

        }


        .logo-glow {

            position: absolute;

            width: 100%;
            height: 100%;

            border-radius: 30px;

            background:
                rgba(
                    99,
                    102,
                    241,
                    0.25
                );

            filter: blur(25px);

            animation:
                glow 2s infinite alternate;

        }


        @keyframes glow {

            from {

                transform:
                    scale(0.9);

                opacity: 0.5;

            }

            to {

                transform:
                    scale(1.2);

                opacity: 1;

            }

        }


        .logo {

            position: relative;

            width: 82px;
            height: 82px;

            max-width: 82%;
            max-height: 82%;

            border-radius: 24px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: clamp(
                30px,
                7vw,
                38px
            );

            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 0 30px
                rgba(
                    99,
                    102,
                    241,
                    0.45
                ),
                inset 0 0 20px
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            animation:
                logoFloat 3s
                ease-in-out infinite;

        }


        @keyframes logoFloat {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-8px);

            }

        }


        /* =====================================================
           BRAND NAME
        ===================================================== */

        .brand {

            font-size:
                clamp(
                    32px,
                    8vw,
                    48px
                );

            font-weight: 800;

            letter-spacing: -1.5px;

            margin-bottom: 10px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a5b4fc,
                    #ffffff
                );

            background-size: 200% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                shine 3s linear infinite;

        }


        @keyframes shine {

            to {

                background-position:
                    200% center;

            }

        }


        /* =====================================================
           TAGLINE
        ===================================================== */

        .tagline {

            color: #a7afc4;

            font-size:
                clamp(
                    13px,
                    3.5vw,
                    15px
                );

            line-height: 1.5;

            margin-bottom:
                clamp(
                    25px,
                    6vw,
                    35px
                );

            letter-spacing: 0.4px;

            max-width: 100%;

        }


        /* =====================================================
           CIRCULAR LOADER
        ===================================================== */

        .loader-circle {

            width:
                clamp(
                    75px,
                    18vw,
                    90px
                );

            height:
                clamp(
                    75px,
                    18vw,
                    90px
                );

            border-radius: 50%;

            position: relative;

            margin-bottom: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .loader-circle::before {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            border:
                3px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-top-color:
                #6366f1;

            border-right-color:
                #8b5cf6;

            animation:
                spin 1.1s linear infinite;

        }


        .loader-circle::after {

            content: "";

            position: absolute;

            inset: 9px;

            border-radius: 50%;

            border:
                2px solid transparent;

            border-bottom-color:
                rgba(
                    139,
                    92,
                    246,
                    0.7
                );

            animation:
                spinReverse 1.5s
                linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        @keyframes spinReverse {

            to {

                transform:
                    rotate(-360deg);

            }

        }


        /* =====================================================
           PERCENTAGE
        ===================================================== */

        .percentage {

            position: relative;

            z-index: 2;

            font-size:
                clamp(
                    16px,
                    4vw,
                    19px
                );

            font-weight: 700;

            color: white;

        }


        /* =====================================================
           LOADING TEXT
        ===================================================== */

        .loading-text {

            font-size:
                clamp(
                    13px,
                    3.5vw,
                    14px
                );

            color: #9ca3b5;

            margin-bottom: 10px;

        }


        .dots {

            display: inline-flex;

            margin-left: 3px;

        }


        .dot {

            animation:
                blink 1.4s infinite;

        }


        .dot:nth-child(2) {

            animation-delay:
                0.2s;

        }


        .dot:nth-child(3) {

            animation-delay:
                0.4s;

        }


        @keyframes blink {

            0%,
            20% {

                opacity: 0;

            }

            50% {

                opacity: 1;

            }

            100% {

                opacity: 0;

            }

        }


        /* =====================================================
           PROGRESS BAR
        ===================================================== */

        .progress-container {

            width:
                min(
                    320px,
                    90%
                );

            height: 4px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 20px;

            overflow: hidden;

            margin-top: 8px;

        }


        .progress-bar {

            height: 100%;

            width: 0%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #6366f1,
                    #8b5cf6,
                    #a78bfa
                );

            box-shadow:
                0 0 15px
                rgba(
                    99,
                    102,
                    241,
                    0.7
                );

            transition:
                width 0.15s ease;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            position: absolute;

            bottom:
                clamp(
                    15px,
                    4vw,
                    25px
                );

            left: 20px;
            right: 20px;

            text-align: center;

            font-size:
                clamp(
                    10px,
                    2.8vw,
                    12px
                );

            line-height: 1.4;

            color: #626b80;

            letter-spacing: 0.5px;

        }


        /* =====================================================
           FADE OUT
        ===================================================== */

        body.fade-out {

            animation:
                fadeOut 0.8s
                ease forwards;

        }


        @keyframes fadeOut {

            from {

                opacity: 1;

            }

            to {

                opacity: 0;

            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            body {
                padding: 12px;
            }

            .loader-container {
                padding: 10px;
            }

            .logo-wrapper {
                width: 72px;
                height: 72px;
                margin-bottom: 18px;
            }

            .logo {
                width: 60px;
                height: 60px;
                border-radius: 18px;
                font-size: 28px;
            }

            .brand {
                font-size: 30px;
            }

            .tagline {
                margin-bottom: 22px;
            }

            .loader-circle {
                width: 70px;
                height: 70px;
                margin-bottom: 20px;
            }

        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (
            min-width: 601px
        ) and (
            max-width: 1024px
        ) {

            .loader-container {
                width: min(
                    90%,
                    520px
                );
            }

        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count:
                    1 !important;

                scroll-behavior: auto !important;

            }

        }

    </style>

</head>


<body>

    <!-- ==============================
         BACKGROUND PARTICLES
    ============================== -->

    <div class="background">

        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

    </div>


    <!-- ==============================
         LOADING CONTENT
    ============================== -->

    <main class="loader-container">

        <!-- Logo -->

        <div class="logo-wrapper">

            <div class="logo-glow"></div>

            <div class="logo">
                ✣
            </div>

        </div>


        <!-- Brand -->

        <h1 class="brand">
            JOB AI
        </h1>


        <!-- Tagline -->

        <p class="tagline">
            Your career journey starts here
        </p>


        <!-- Circular Loader -->

        <div class="loader-circle">

            <span
                class="percentage"
                id="percentage"
            >
                0%
            </span>

        </div>


        <!-- Loading Text -->

        <div class="loading-text">

            Preparing your experience

            <span class="dots">

                <span class="dot">.</span>
                <span class="dot">.</span>
                <span class="dot">.</span>

            </span>

        </div>


        <!-- Progress Bar -->

        <div class="progress-container">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>

    </main>


    <!-- ==============================
         FOOTER
    ============================== -->

    <div class="footer">
        © 2026 JOB AI • Build your future
    </div>


    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <script>

        let progress = 0;


        const percentage =
            document.getElementById(
                "percentage"
            );


        const progressBar =
            document.getElementById(
                "progressBar"
            );


        /*
         * Loading animation
         */

        const loadingInterval =
            setInterval(() => {

                /*
                 * Increase loading percentage
                 */

                progress +=
                    Math.floor(
                        Math.random() * 7
                    ) + 1;


                /*
                 * Prevent percentage
                 * from going above 100
                 */

                if (progress >= 100) {

                    progress = 100;

                    clearInterval(
                        loadingInterval
                    );

                }


                /*
                 * Update percentage
                 */

                percentage.textContent =
                    progress + "%";


                /*
                 * Update progress bar
                 */

                progressBar.style.width =
                    progress + "%";


                /*
                 * When loading is complete
                 */

                if (progress === 100) {

                    setTimeout(() => {

                        document.body.classList.add(
                            "fade-out"
                        );


                        /*
                         * Open main website
                         */

                        setTimeout(() => {

                            window.location.href =
                                "signup.html";

                        }, 800);

                    }, 400);

                }

            }, 100);

    </script>

</body>

</html>
